name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each action is on its newest major, all running on Node 24 (ADR 0005). Deliberate pins, each
# explained in docs/LEARNINGS.md:
# - ubuntu-26.04, not ubuntu-latest: the newest LTS, which Playwright supports from 1.61. A named
#   image means the OS changes in a commit we make, not in a runner rollout.
# - pnpm/action-setup@v6.1.0, not @v6: the v6 tag still points at 6.0.10, which predates pnpm 12
#   support (pnpm/action-setup#289). Return to @v6 once the tag moves.
jobs:
  verify:
    name: Lint, format, typecheck, test, build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle:check

  e2e:
    name: Browser and accessibility checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bigsmall/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
