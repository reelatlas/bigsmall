}

  const b=DATA.brands[brand],m=b.measurement;
  let h=`<section class="notes"><h2>How ${esc(b.brand)} measures</h2><p>${esc(m.basis)}</p>
<h3>Measuring (adults)</h3><ol>${li(m.how_to_measure_adult)}</ol>
<h3>Measuring (kids)</h3><ol>${li(m.how_to_measure_kids)}</ol>
<h3>In between sizes</h3><p>${esc(m.in_between_sizes)}</p>
<h3>Fit note</h3><p>${esc(m.fit_note)}</p>`;
  if(m.widths)h+=`<h3>Width letters</h3><ul>${li(Object.entries(m.widths).map(([k,v])=>k+': '+v))}</ul>`;
  h+=`<h3>Quirks to handle in code</h3><ul class="quirk">${li(m.quirks)}</ul><p class="meta" style="margin-top:10px">Source: ${esc(b.source)}</p></section>`;
  h+='<h3 class="group">Length charts</h3>';
  for(const [key,c] of Object.entries(b.charts)){
    const keys=Object.keys(LABELS).filter(k=>c[k]);
    h+=tableOf(`${key} — ${c.ages}`,c,keys,k=>LABELS[k]);
  }
  if(b.widths){
    h+='<h3 class="group">Width charts (ball width per US size)</h3>';
    for(const [key,c] of Object.entries(b.widths)){
      const sizeKey=Object.keys(c).find(k=>k.startsWith('us_'));
      const keys=[sizeKey,...Object.keys(c).filter(k=>k.startsWith('w_')&&!k.endsWith('_label'))];
      h+=tableOf(`${key} widths`,c,keys,k=>{if(k===sizeKey)return LABELS[k];const [,code,u]=k.split('_');return `${c.widths[code]} ${code} (${u})`;});
    }
  }
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('#tabs [data-brand]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.brand===brand)));
}
const tabs=document.getElementById('tabs');
for(const [k,b] of Object.entries(DATA.brands)){const el=document.createElement('button');el.dataset.brand=k;el.id='tab-'+k;el.textContent=b.brand;el.onclick=()=>{brand=k;render();};tabs.prepend(el);}
tabs.prepend(Object.assign(document.createElement('span'),{textContent:'Brand:'}));
const jb=document.getElementById('btn-json'),jp=document.getElementById('json');
jp.textContent=JSON.stringify(DATA,null,2);
jb.onclick=()=>{jp.hidden=!jp.hidden;jb.setAttribute('aria-pressed',String(!jp.hidden));jb.textContent=jp.hidden?'show JSON':'hide JSON';};
render();
</script>
